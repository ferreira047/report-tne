<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f3">
  <title>Entrar · Report TNE</title>
  <link rel="stylesheet" href="app/theme.css?v=20261024a">
  <script src="app/theme.js?v=20261024a"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--paper);
      background-image: radial-gradient(var(--line) 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    .panel { background: var(--panel); border: 1px solid var(--line); }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
    <div class="mb-6 flex items-center justify-between">
      <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.12em] text-[color:var(--green)]">
        <span class="inline-block h-2 w-2 rounded-full bg-[color:var(--green-solid)]"></span>
        Operação · acesso restrito
      </div>
      <button id="theme-toggle" type="button" class="theme-toggle inline-flex h-[34px] w-[34px] shrink-0 items-center justify-center rounded-sm border border-[color:var(--line)] bg-[color:var(--surface)] text-[color:var(--ink-3)] transition hover:bg-[color:var(--green-soft)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[color:var(--green)]" aria-label="Ativar tema escuro" title="Ativar tema escuro">
        <svg aria-hidden="true" class="icon-moon h-4 w-4" viewBox="0 0 20 20" fill="none"><path d="M16.5 12.2A6.5 6.5 0 017.8 3.5a6.5 6.5 0 108.7 8.7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <svg aria-hidden="true" class="icon-sun h-4 w-4" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <main class="panel rounded-sm p-6 shadow-sm sm:p-8">
      <h1 class="text-2xl font-semibold tracking-tight text-[color:var(--ink)]">Report Backlog TNE</h1>
      <p class="mt-2 text-sm leading-6 text-[color:var(--muted)]">Entre com seu usuário para acessar o report e a análise de técnicos.</p>

      <form id="login-form" class="mt-6 flex flex-col gap-4" novalidate>
        <label class="flex flex-col gap-1.5 text-xs font-medium text-[color:var(--ink-3)]">
          Usuário
          <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required class="rounded-sm border border-[color:var(--line-strong)] bg-[color:var(--surface)] px-3 py-2.5 text-sm text-[color:var(--ink)] focus:border-[color:var(--green)] focus:outline-none focus:ring-2 focus:ring-[color:var(--ring)]">
        </label>
        <label class="flex flex-col gap-1.5 text-xs font-medium text-[color:var(--ink-3)]">
          Senha
          <input id="login-password" name="password" type="password" autocomplete="current-password" required class="rounded-sm border border-[color:var(--line-strong)] bg-[color:var(--surface)] px-3 py-2.5 text-sm text-[color:var(--ink)] focus:border-[color:var(--green)] focus:outline-none focus:ring-2 focus:ring-[color:var(--ring)]">
        </label>
        <p id="login-error" role="alert" class="hidden rounded-sm border border-[color:var(--error-line)] bg-[color:var(--error-bg)] px-3 py-2 text-sm text-[color:var(--error-ink)]"></p>
        <button id="login-submit" type="submit" class="mt-1 inline-flex items-center justify-center rounded-sm bg-[color:var(--green-solid)] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[color:var(--green-solid-hover)] disabled:cursor-wait disabled:opacity-70">Entrar</button>
      </form>
    </main>

    <p class="mt-4 text-center text-xs text-[color:var(--faint)]">O cadastro dos técnicos é aberto no seu navegador; a senha não é enviada a nenhum servidor.</p>
  </div>

  <script src="app/cadastro.enc.js?v=20261030a"></script>
  <script src="app/auth.js?v=20261030a"></script>
  <script>
    'use strict';
    (function () {
      // Já entrou nesta aba: segue direto
      if (readAuthSession()) {
        location.replace(pageAfterLogin());
        return;
      }
      const form = document.getElementById('login-form');
      const user = document.getElementById('login-user');
      const password = document.getElementById('login-password');
      const error = document.getElementById('login-error');
      const submit = document.getElementById('login-submit');

      function showError(message) {
        error.textContent = message;
        error.classList.remove('hidden');
      }

      user.focus();
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.classList.add('hidden');
        if (!user.value.trim() || !password.value) {
          showError('Informe usuário e senha.');
          return;
        }
        submit.disabled = true;
        submit.textContent = 'Entrando…';
        try {
          await login(user.value, password.value);
          location.replace(pageAfterLogin());
        } catch (err) {
          showError(err instanceof LoginError ? err.message : 'Não foi possível entrar. Tente novamente.');
          password.value = '';
          password.focus();
          submit.disabled = false;
          submit.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
